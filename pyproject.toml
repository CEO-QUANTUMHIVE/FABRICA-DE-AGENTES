[project]
name = "quantumhive-motor-voz"
version = "0.1.0"
description = "Motor de voz multi-tenant de QuantumHive"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[fishaudio,google,groq,silero]~=1.6",
    "livekit-api>=1.0",
    "python-dotenv>=1.0",
    "supabase>=2.9,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motor_voz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "smoke: llama APIs reales y consume creditos. No corre por defecto.",
    "integracion: requiere Supabase real (sin costo, pero si red). No corre por defecto.",
]
addopts = "-m 'not smoke and not integracion'"
